name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Drive source into index.html
        env:
          DRIVE_FOLDER_URL: ${{ secrets.DRIVE_FOLDER_URL }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: |
          mkdir -p _site
          envsubst '${DRIVE_FOLDER_URL} ${DRIVE_API_KEY}' < index.html > _site/index.html
          [ -f CNAME ] && cp CNAME _site/CNAME || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
